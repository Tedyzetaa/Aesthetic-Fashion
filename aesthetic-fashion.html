<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Fashion — Diário Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F5F0EB;
    --card:#E6DFD5;
    --ink:#2A2522;
    --ink-soft:#544C45;
    --gold:#C5A880;
    --gold-deep:#A8875C;
    --line: rgba(42,37,34,0.12);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--bg);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px;}}

  .setup-banner{
    background:var(--ink);color:var(--bg);text-align:center;font-size:13px;
    padding:12px 20px;line-height:1.5;
  }
  .setup-banner strong{color:var(--gold);}

  /* ===== Header ===== */
  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(245,240,235,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .site-header .wrap{
    display:flex;align-items:center;justify-content:space-between;
    height:84px;
  }
  .logo-mark{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:0.04em;
    font-weight:600;
    display:flex;flex-direction:column;line-height:1;
    cursor:pointer;
  }
  .logo-mark small{
    font-family:var(--sans);
    font-size:9px;
    letter-spacing:0.28em;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:6px;
  }
  .main-nav{display:flex;gap:36px;align-items:center;}
  .main-nav button{
    background:none;border:none;color:var(--ink);
    font-size:13.5px;letter-spacing:0.03em;
    padding:6px 0;position:relative;
    border-bottom:1px solid transparent;
    transition:border-color .25s ease, color .25s ease;
  }
  .main-nav button.active,.main-nav button:hover{border-color:var(--gold-deep);color:var(--gold-deep);}
  .nav-toggle{display:none;background:none;border:1px solid var(--line);padding:8px 12px;border-radius:var(--radius);}
  @media(max-width:820px){
    .main-nav{position:fixed;top:84px;left:0;right:0;background:var(--bg);
      flex-direction:column;align-items:flex-start;gap:0;
      border-bottom:1px solid var(--line);
      max-height:0;overflow:hidden;transition:max-height .3s ease;}
    .main-nav.open{max-height:320px;}
    .main-nav button{width:100%;padding:16px 32px;border-bottom:1px solid var(--line);}
    .nav-toggle{display:block;}
  }

  /* ===== Hero ===== */
  .hero{
    padding:96px 0 72px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .hero .eyebrow{
    font-size:12px;color:var(--gold-deep);letter-spacing:0.18em;margin-bottom:22px;
  }
  .hero h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(38px,6vw,72px);
    line-height:1.08;
    margin:0 auto 26px;
    max-width:820px;
  }
  .hero h1 em{font-style:italic;color:var(--gold-deep);}
  .hero p{
    max-width:520px;margin:0 auto;color:var(--ink-soft);font-size:16.5px;
  }

  /* ===== Filter tabs ===== */
  .filter-row{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    padding:40px 0 8px;
  }
  .filter-chip{
    background:transparent;border:1px solid var(--line);
    padding:9px 20px;border-radius:999px;font-size:13px;letter-spacing:0.02em;
    color:var(--ink-soft);transition:all .2s ease;
  }
  .filter-chip.active,.filter-chip:hover{
    border-color:var(--gold-deep);background:var(--gold);color:#fff;
  }

  /* ===== Feed ===== */
  .feed{
    display:grid;grid-template-columns:repeat(3,1fr);gap:44px 32px;
    padding:48px 0 100px;
  }
  .feed.featured-layout{grid-template-columns:repeat(3,1fr);}
  .feed.featured-layout .card:first-child{grid-column:span 2;grid-row:span 2;}
  .feed.featured-layout .card:first-child .card-media{aspect-ratio:16/13;}
  @media(max-width:960px){
    .feed{grid-template-columns:repeat(2,1fr);}
    .feed.featured-layout .card:first-child{grid-column:span 2;}
  }
  @media(max-width:640px){
    .feed{grid-template-columns:1fr;}
    .feed.featured-layout .card:first-child{grid-column:span 1;}
  }
  .card{cursor:pointer;}
  .card-media{
    aspect-ratio:4/5;overflow:hidden;background:var(--card);
    margin-bottom:18px;
  }
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1);}
  .card:hover .card-media img{transform:scale(1.045);}
  .card-cat{
    font-size:11.5px;color:var(--gold-deep);letter-spacing:0.14em;margin-bottom:10px;
  }
  .card h3{
    font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.28;margin:0 0 10px;
  }
  .feed.featured-layout .card:first-child h3{font-size:32px;}
  .card p{color:var(--ink-soft);font-size:14.5px;margin:0 0 12px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .card-meta{font-size:12px;color:var(--ink-soft);opacity:.75;}

  .empty-state{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
  }
  .empty-state h3{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:10px;}

  /* ===== Footer ===== */
  .site-footer{border-top:1px solid var(--line);padding:56px 0 40px;}
  .site-footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}
  .footer-brand{font-family:var(--serif);font-size:19px;}
  .footer-note{font-size:12.5px;color:var(--ink-soft);}
  .footer-admin-link{font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  .footer-admin-link:hover{color:var(--gold-deep);border-color:var(--gold-deep);}

  /* ===== Post reading page ===== */
  .post-page{padding-bottom:100px;}
  .post-top{padding:52px 0 0;}
  .back-link{font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px;margin-bottom:34px;}
  .back-link:hover{color:var(--gold-deep);}
  .post-header{max-width:760px;margin:0 auto;text-align:center;}
  .post-cat{font-size:12.5px;color:var(--gold-deep);letter-spacing:0.1em;margin-bottom:18px;}
  .post-header h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,52px);line-height:1.15;margin:0 0 22px;}
  .post-sub{color:var(--ink-soft);font-size:17px;max-width:600px;margin:0 auto;}
  .post-cover{margin:48px 0 8px;}
  .post-cover img{width:100%;max-height:640px;object-fit:cover;}
  .post-body{max-width:680px;margin:56px auto 0;font-size:18px;line-height:1.85;}
  .post-body p{margin:0 0 26px;}
  .post-body h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:52px 0 20px;}
  .post-body h3{font-family:var(--serif);font-weight:500;font-size:23px;margin:40px 0 16px;}
  .post-body ul,.post-body ol{margin:0 0 26px;padding-left:24px;}
  .post-body li{margin-bottom:8px;}
  .post-body blockquote{
    font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.5;
    color:var(--ink);border-left:2px solid var(--gold);
    margin:44px 0;padding:4px 0 4px 30px;
  }
  .post-body a{border-bottom:1px solid var(--gold-deep);color:var(--gold-deep);}
  .post-body figure.editor-image{margin:40px 0;max-width:100%;}
  .post-body figure.editor-image img{width:100%;}
  .post-body figure.editor-image figcaption{
    font-size:13px;color:var(--ink-soft);text-align:center;margin-top:10px;font-style:italic;
  }
  .gallery-carousel{margin:44px -8px;}
  .gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:0 8px;scrollbar-width:none;}
  .gallery-track::-webkit-scrollbar{display:none;}
  .gallery-track img{scroll-snap-align:center;flex:0 0 84%;aspect-ratio:4/5;object-fit:cover;}
  .gallery-dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
  .gallery-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}

  /* Byline / footer meta, Blogger-style: title -> body -> author & date */
  .post-footer{
    max-width:680px;margin:64px auto 0;padding-top:28px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  }
  .byline{display:flex;align-items:center;gap:12px;}
  .byline-avatar{
    width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;flex:0 0 auto;
  }
  .byline-name{font-size:14.5px;font-weight:600;}
  .byline-date{font-size:12.5px;color:var(--ink-soft);}
  .post-tags{max-width:680px;margin:24px auto 0;display:flex;gap:8px;flex-wrap:wrap;}
  .tag-pill{font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:6px 14px;}

  .related{max-width:1180px;margin:96px auto 0;padding:0 32px;}
  .related h4{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:28px;text-align:center;}

  /* ===== Admin shared ===== */
  .admin-shell{min-height:100vh;background:var(--bg);}
  .admin-topbar{
    background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;height:64px;
  }
  .admin-topbar .logo-mark{color:var(--bg);}
  .admin-topbar .logo-mark small{color:var(--gold);}
  .admin-btn{
    background:var(--gold);color:#fff;border:none;padding:11px 22px;
    font-size:13.5px;letter-spacing:0.02em;border-radius:var(--radius);
    transition:background .2s ease;
  }
  .admin-btn:hover{background:var(--gold-deep);}
  .admin-btn.ghost{background:none;border:1px solid rgba(245,240,235,0.3);color:var(--bg);}
  .admin-btn.ghost:hover{border-color:var(--gold);color:var(--gold);}
  .admin-btn.danger{background:none;border:1px solid #b5504a;color:#b5504a;}
  .admin-btn.danger:hover{background:#b5504a;color:#fff;}
  .admin-btn.small{padding:7px 14px;font-size:12px;}

  .login-shell{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
  }
  .login-card{
    width:100%;max-width:400px;background:var(--card);padding:52px 44px;text-align:center;
  }
  .login-card .logo-mark{justify-content:center;align-items:center;margin-bottom:36px;}
  .login-card h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px;}
  .login-card .hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:30px;}
  .field{text-align:left;margin-bottom:18px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:7px;letter-spacing:0.03em;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);background:var(--bg);
    padding:13px 14px;font-size:14.5px;color:var(--ink);border-radius:var(--radius);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-deep);}
  .login-error{color:#b5504a;font-size:13px;margin-bottom:14px;min-height:16px;}
  .login-card .admin-btn{width:100%;margin-top:8px;}

  .admin-main{max-width:1080px;margin:0 auto;padding:48px 32px 100px;}
  .admin-head-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap;gap:16px;}
  .admin-head-row h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0;}
  .admin-head-row p{color:var(--ink-soft);font-size:13.5px;margin:6px 0 0;}

  .post-table{width:100%;border-collapse:collapse;}
  .post-table th{
    text-align:left;font-size:11.5px;letter-spacing:0.08em;color:var(--ink-soft);
    padding:0 14px 14px;border-bottom:1px solid var(--line);font-weight:500;
  }
  .post-table td{padding:18px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  .post-table tr:last-child td{border-bottom:none;}
  .row-thumb{width:56px;height:56px;object-fit:cover;background:var(--card);}
  .row-title{font-family:var(--serif);font-size:16px;}
  .status-badge{font-size:11px;padding:4px 10px;border-radius:999px;letter-spacing:0.03em;}
  .status-badge.published{background:rgba(197,168,128,0.22);color:var(--gold-deep);}
  .status-badge.draft{background:var(--card);color:var(--ink-soft);}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:var(--radius);
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
  .icon-btn:hover{border-color:var(--gold-deep);color:var(--gold-deep);}

  /* ===== Editor ===== */
  .editor-grid{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start;}
  @media(max-width:900px){.editor-grid{grid-template-columns:1fr;}}
  .title-input{
    font-family:var(--serif);font-weight:500;font-size:34px;border:none;background:none;
    width:100%;padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:26px;color:var(--ink);
  }
  .title-input:focus{outline:none;border-color:var(--gold-deep);}
  .title-input::placeholder{color:#B7AFA5;}
  .toolbar{
    display:flex;gap:4px;flex-wrap:wrap;background:var(--card);padding:8px;border-radius:var(--radius);margin-bottom:16px;
    position:sticky;top:84px;z-index:5;
  }
  .toolbar button{
    background:none;border:none;width:34px;height:34px;border-radius:2px;font-size:14px;color:var(--ink);
    display:inline-flex;align-items:center;justify-content:center;
  }
  .toolbar button:hover{background:rgba(255,255,255,0.6);color:var(--gold-deep);}
  .toolbar .sep{width:1px;background:var(--line);margin:6px 4px;}
  #editorContent{
    min-height:420px;background:#fff;border:1px solid var(--line);padding:36px;font-size:17px;line-height:1.8;
  }
  #editorContent:focus{outline:none;border-color:var(--gold-deep);}
  #editorContent h2{font-family:var(--serif);font-size:26px;font-weight:500;margin:30px 0 14px;}
  #editorContent h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:24px 0 12px;}
  #editorContent blockquote{font-family:var(--serif);font-style:italic;font-size:22px;border-left:2px solid var(--gold);padding-left:20px;margin:26px 0;color:var(--ink-soft);}
  #editorContent p{margin:0 0 18px;}
  #editorContent figure.editor-image{resize:both;overflow:hidden;max-width:100%;border:1px dashed var(--line);padding:6px;margin:20px 0;min-width:160px;min-height:120px;}
  #editorContent figure.editor-image img{width:100%;height:calc(100% - 26px);object-fit:cover;}
  #editorContent figure.editor-image figcaption{font-size:12.5px;color:var(--ink-soft);text-align:center;padding-top:6px;font-style:italic;}
  #editorContent .editor-gallery{display:flex;gap:8px;overflow-x:auto;padding:10px;background:var(--card);margin:20px 0;}
  #editorContent .editor-gallery img{width:140px;height:170px;object-fit:cover;flex:0 0 auto;}
  #editorContent[data-empty="true"]:before{content:attr(data-placeholder);color:#B7AFA5;}

  .side-panel{background:var(--card);padding:26px;position:sticky;top:180px;}
  .side-panel h4{font-family:var(--serif);font-size:16px;font-weight:500;margin:0 0 18px;}
  .cover-drop{
    border:1px dashed var(--line);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;overflow:hidden;margin-bottom:8px;background:#fff;
  }
  .cover-drop img{width:100%;height:100%;object-fit:cover;}
  .autosave-note{font-size:11.5px;color:var(--ink-soft);margin-top:20px;text-align:center;min-height:14px;}
  .status-toggle{display:flex;gap:8px;margin-top:6px;}
  .status-toggle button{flex:1;padding:9px;font-size:12.5px;border:1px solid var(--line);background:none;border-radius:var(--radius);}
  .status-toggle button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .side-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:var(--bg);padding:13px 24px;border-radius:var(--radius);font-size:13.5px;
    opacity:0;transition:all .3s ease;z-index:200;pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
  button:focus-visible, a:focus-visible, input:focus-visible, [contenteditable]:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   CONEXÃO COM SUPABASE
   1) Crie um projeto em https://supabase.com
   2) Rode o SQL de configuração (fornecido junto com este arquivo)
   3) Cole abaixo a URL do projeto e a chave "anon public"
      (Project Settings > API). A anon key é segura para uso no
      navegador desde que as políticas de RLS estejam ativas.
   ====================================================================== */
const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';       // <-- SUBSTITUA
const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLICA_AQUI';       // <-- SUBSTITUA

const SUPABASE_CONFIGURED = SUPABASE_URL.indexOf('SEU-PROJETO') === -1 && SUPABASE_ANON_KEY.indexOf('SUA_CHAVE') === -1;
let sb = null;
if (SUPABASE_CONFIGURED && window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
}

/* ============ LOCAL STORAGE HELPERS (apenas para rascunhos locais do editor) ============ */
async function storeGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{ await window.storage.set(key, value, !!shared); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}
async function storeDel(key, shared){
  try{ await window.storage.delete(key, !!shared); }catch(e){}
}

const DRAFT_PREFIX = 'af:draft:';

function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function seedPosts(){
  return [
    {
      id:'demo1', status:'published', category:'Inspiração',
      title:'Cartas para quem se veste de alma exposta',
      excerpt:'Um exercício de sensibilidade: como a moda vira linguagem quando as palavras não bastam.',
      coverImage:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1400&q=80',
      tags:['sensibilidade','autoestima','moda autoral'], author:'Equipe Aesthetic Fashion',
      date:new Date(Date.now()-86400000*2).toISOString(),
      contentHtml:'<p>Há dias em que a roupa que escolhemos diz mais do que qualquer frase pronta. Vestir-se, para mim, deixou de ser sobre seguir tendência — passou a ser sobre escrever, todos os dias, uma carta silenciosa para quem eu estou me tornando.</p><blockquote>Estilo é a pontuação de uma frase que o corpo ainda está aprendendo a dizer.</blockquote><p>Quando escolho um tecido, uma cor, um caimento, estou decidindo qual parte de mim quero que o mundo escute primeiro. Não há fórmula. Há intenção.</p>'
    },
    {
      id:'demo2', status:'published', category:'Estilo',
      title:'Alfaiataria macia: o poder do corte que abraça',
      excerpt:'Como peças estruturadas podem carregar suavidade sem perder presença.',
      coverImage:'https://images.unsplash.com/photo-1487222477894-8943e31ef7b1?auto=format&fit=crop&w=1400&q=80',
      tags:['alfaiataria','minimalismo'], author:'Equipe Aesthetic Fashion',
      date:new Date(Date.now()-86400000*6).toISOString(),
      contentHtml:'<p>Existe uma alfaiataria que não impõe — ela acolhe. Ombros levemente estruturados, caimento fluido, tecidos que respiram junto com quem os veste.</p><h3>Três peças que sustentam esse universo</h3><ul><li>Blazer oversized em linho cru</li><li>Calça pantalona de cintura alta</li><li>Camisa de seda em tom areia</li></ul>'

function rowToPost(r){
  return {
    id:r.id, title:r.title, excerpt:r.excerpt, contentHtml:r.content_html,
    category:r.category, tags:r.tags||[], coverImage:r.cover_image,
    status:r.status, author:r.author, date:r.created_at
  };
}
function postToRow(p){
  return {
    title:p.title, excerpt:p.excerpt, content_html:p.contentHtml,
    category:p.category, tags:p.tags, cover_image:p.coverImage,
    status:p.status, author:p.author
  };
}

async function loadPosts(){
  if(!sb){ state.posts = seedPosts(); state.demoMode = true; return; }
  const {data, error} = await sb.from('posts').select('*').order('created_at', {ascending:false});
  if(error){
    console.error(error);
    state.posts = seedPosts(); state.demoMode = true;
    showToast('Não foi possível conectar ao Supabase. Exibindo conteúdo de exemplo.');
    return;
  }
  state.posts = (data||[]).map(rowToPost);
  state.demoMode = false;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});
}
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function initials(name){
  if(!name) return 'AF';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
}

/* ============ ROUTER ============ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {view:'home'};
  if(parts[0]==='post') return {view:'post', postId:parts[1]};
  if(parts[0]==='admin' && parts[1]==='editor') return {view:'admin-editor', editingId:parts[2]||'new'};
  if(parts[0]==='admin') return {view: state.isAdmin ? 'admin-dashboard' : 'admin-login'};
  return {view:'home'};
}
function navigate(hash){ location.hash = hash; }
window.addEventListener('hashchange', ()=>{ Object.assign(state, parseHash()); state.navOpen=false; render(); });

function galleryScript(){
  document.querySelectorAll('.gallery-carousel').forEach(g=>{
    const track = g.querySelector('.gallery-track');
    const dots = g.querySelectorAll('.gallery-dots span');
    if(!track) return;
    function update(){
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      dots.forEach((d,i)=> d.style.background = i===idx ? 'var(--gold-deep)' : 'var(--line)');
    }
    track.addEventListener('scroll', ()=>requestAnimationFrame(update));
    update();
  });
}

  scheduleAutosave();

}
function triggerImageInsert(){ document.getElementById('imgFileInput').click(); }
function triggerGalleryInsert(){ document.getElementById('galleryFileInput').click(); }

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* Envia para o Supabase Storage (bucket "post-images") quando conectado;
   cai para base64 embutido quando estiver em modo de demonstração. */
async function uploadImage(file, folder){
  if(sb){
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_')}`;
    const {error} = await sb.storage.from('post-images').upload(path, file, {cacheControl:'3600', upsert:false});
    if(error){ console.error(error); showToast('Falha no upload — usando imagem local.'); return await fileToDataURL(file); }
    const { data } = sb.storage.from('post-images').getPublicUrl(path);
    return data.publicUrl;
  }
  return await fileToDataURL(file);
}

async function handleImageInsert(e){
  const file = e.target.files[0];
  if(!file) return;
  const url = await uploadImage(file, 'content');
  const html = `<figure class="editor-image" contenteditable="false"><img src="${url}" alt=""><figcaption contenteditable="true" data-placeholder="Legenda (opcional)"></figcaption></figure><p><br></p>`;
  document.getElementById('editorContent').focus();
  document.execCommand('insertHTML', false, html);
  e.target.value='';
  scheduleAutosave();
}
async function handleGalleryInsert(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  const urls = await Promise.all(files.map(f=>uploadImage(f, 'gallery')));
  const dots = urls.map(()=>`<span></span>`).join('');
  const imgs = urls.map(u=>`<img src="${u}" alt="">`).join('');
  const html = `<div class="gallery-carousel" contenteditable="false"><div class="gallery-track">${imgs}</div><div class="gallery-dots">${dots}</div></div><p><br></p>`;
  document.getElementById('editorContent').focus();
  document.execCommand('insertHTML', false, html);
  e.target.value='';
  scheduleAutosave();
}
async function handleCoverUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const url = await uploadImage(file, 'covers');
  document.getElementById('coverDrop').innerHTML = `<img src="${url}" alt="">`;
  state.editing.coverImage = url;
  scheduleAutosave();
}
function setStatus(s){
  state._editorStatus = s;
  document.getElementById('btnDraft').classList.toggle('active', s==='draft');
  document.getElementById('btnPublished').classList.toggle('active', s==='published');
  scheduleAutosave();
}

function collectEditorData(){
  const p = state.editing;
  return {
    id: p.id,
    title: document.getElementById('fTitle').value,
    excerpt: document.getElementById('fExcerpt').value,
    category: document.getElementById('fCategory').value,
    author: document.getElementById('fAuthor').value,
    tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    contentHtml: document.getElementById('editorContent').innerHTML,
    coverImage: p.coverImage||'',
    status: state._editorStatus||p.status,
    date: p.date || new Date().toISOString(),
    _savedAt: Date.now()
  };
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  const note = document.getElementById('autosaveNote');
  if(note) note.textContent = 'Salvando rascunho local…';
  autosaveTimer = setTimeout(async ()=>{
    const data = collectEditorData();
    const key = DRAFT_PREFIX + (state.editingId==='new' ? 'new' : data.id);
    await storeSet(key, JSON.stringify(data), false);
    Object.assign(state.editing, data);
    const n = document.getElementById('autosaveNote');
    if(n) n.textContent = 'Rascunho salvo às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }, 900);
}

async function savePost(){
  const data = collectEditorData();
  if(!data.title.trim()){ showToast('Dê um título ao post antes de salvar.'); return; }
  if(!data.author.trim()){ showToast('Informe o nome do autor.'); return; }
  if(!sb){ showToast('Conecte o Supabase (veja o topo do código) para salvar de verdade.'); return; }

  const row = postToRow(data);
  let result;
  if(state.editingId !== 'new'){
    result = await sb.from('posts').update(row).eq('id', state.editingId).select().single();
  } else {
    result = await sb.from('posts').insert(row).select().single();
  }
  if(result.error){ showToast('Erro ao salvar: ' + result.error.message); return; }

  const key = DRAFT_PREFIX + (state.editingId==='new' ? 'new' : data.id);
  await storeDel(key, false);
  await loadPosts();
  showToast(data.status==='published' ? 'Post publicado.' : 'Rascunho salvo.');
  navigate('/admin');
}

/* ============ MAIN RENDER DISPATCH ============ */
async function render(){
  const app = document.getElementById('app');
  if(state.view==='admin-editor'){
    app.innerHTML = `<div class="admin-shell">${adminTopbar()}<div class="admin-main"><p>Carregando editor…</p></div></div>`;
    await renderAdminEditor();
    return;
  }
  if(state.view==='admin-dashboard'){
    if(!state.isAdmin){ app.innerHTML = renderAdminLogin(); return; }
    app.innerHTML = renderAdminDashboard();
    return;
  }
  if(state.view==='admin-login'){
    app.innerHTML = state.isAdmin ? renderAdminDashboard() : renderAdminLogin();
    return;
  }
  if(state.view==='post'){ app.innerHTML = renderPost(); galleryScript(); window.scrollTo(0,0); return; }
  app.innerHTML = renderHome();
}

/* ============ INIT ============ */
(async function init(){
  Object.assign(state, parseHash());
  if(sb){
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ state.isAdmin = true; state.adminEmail = session.user.email; }
  }
  await loadPosts();
  render();
})();
</script>
</body>
</html>
